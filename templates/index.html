<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de peso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Special+Gothic+Expanded+One&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='/css/index/style.css') }}"
    />
  </head>
  <body class="contenido">
    <div class="fondo-blur"></div>
    <div class="container">
      <h1>Cuánto pesas en otros planetas?</h1>
      <form action="/calcular" method="post">
        <label for="peso" class="label">Peso:</label>
        <input type="number" name="peso" id="peso" />
        <br />
        <button type="submit">Calcular</button>
      </form>
    </div>
  </body>
</html>
